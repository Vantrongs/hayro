[package]
name = "hayro-ccitt"
version = "0.4.0"
description = "A decoder for group 3 and group 4 CCITT images."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
exclude = ["/tests/"]
autotests = false

[features]
# Counts the decoder's steps on each thread in debug builds, for tests that bound
# the work between two asks of `Decoder::stop`.
std = []

[lints]
workspace = true

[dev-dependencies]
image = { workspace = true, default-features = false, features = ["png"] }

[[test]]
name = "tests"
path = "tests/main.rs"
