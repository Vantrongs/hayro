[workspace]
resolver = "2"
members = [
    "hayro-interpret",
    "hayro",
    "hayro-bench",
    "hayro-syntax",
    "hayro-demo",
    "hayro-tests",
    "hayro-write",
    "hayro-svg",
    "hayro-jpeg2000",
    "hayro-jbig2",
    "hayro-ccitt",
    "hayro-fuzz",
    "hayro-postscript",
    "hayro-cmap"
]

[workspace.package]
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92" # also change in ci.yml
repository = "https://github.com/LaurenzV/hayro"
readme = "README.md"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
hayro = { path = "hayro", version = "0.8.0", default-features = false }
hayro-ccitt = { path = "hayro-ccitt", version = "0.4.0", default-features = false }
hayro-interpret = { path = "hayro-interpret", version = "0.8.0", default-features = false }
hayro-jpeg2000 = { path = "hayro-jpeg2000", version = "0.4.1", default-features = false }
hayro-jbig2 = { path = "hayro-jbig2", version = "0.3.1", default-features = false }
hayro-syntax = { path = "hayro-syntax", version = "0.8.0", default-features = false }
hayro-svg = { path = "hayro-svg", version = "0.8.0", default-features = false }
hayro-write = { path = "hayro-write", version = "0.8.0", default-features = false }
hayro-postscript = { path = "hayro-postscript", version = "0.1.0", default-features = false }
hayro-cmap = { path = "hayro-cmap", version = "0.1.0", default-features = false }

bitflags = { version = "2.10" }
bytemuck = { version = "1" }
image = { version = "0.25", default-features = false }
kurbo = { version = "0.13.0" }
log = { version = "0.4" }
resvg = { version = "0.47.0" }
flate2 = { version = "1" }
html5ever = { version = "0.39.0" }
zlib-rs = { version = "0.6.8", default-features = false, features = ["std"] }
phf = { version = "0.13.1", default-features = false }
moxcms = { version = "0.8.1" }
foldhash = { version = "0.2", default-features = false, features = ["std"] }
siphasher = "1"
skrifa = { version = "0.46.0" }
smallvec = { version = "1" }
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
yoke = { version = "0.8" }
pdf-writer = { version = "0.15" }
xmlwriter = { version = "0.1" }
base64 = { version = "0.22" }
zune-jpeg = { version = "0.5", default-features = false }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "png", "u8_pipeline"] }
pic-scale = { version = "0.7.9", default-features = false }
fearless_simd = "1.0.0"
brotli = { version = "8", default-features = false, features = ["std"] }
memchr = { version = "2.8.0", default-features = false, features = ["alloc"] }

[workspace.lints]
# This one may vary depending on the project.
#rust.unsafe_code = "forbid"

# LINEBENDER LINT SET - Cargo.toml - v7
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
#rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

#clippy.allow_attributes_without_reason = "warn"
#clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
# A map hashed at random iterates in another order each run (hayro_syntax::hash).
clippy.iter_over_hash_type = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
#clippy.missing_assert_message = "warn"
#clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
#clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

#clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

# Makes it easier to debug with a profiler
[profile.instrument]
inherits = "release"
debug = true
strip = "none"

[profile.fuzz]
inherits = "release"
debug = 1
overflow-checks = true

[patch.crates-io]
# Strokes and dashes whose work stays bounded by the view: a dash pattern far finer
# than a pixel is drawn solid rather than expanded dash by dash. An unclipped layer is
# composited only where each row drew, which knockout groups rely on.
vello_common = { git = "https://github.com/Vantrongs/vello", rev = "a7b734da1dc3648a19bd26e9a0bd15f9aa1e7de5" }
vello_cpu = { git = "https://github.com/Vantrongs/vello", rev = "a7b734da1dc3648a19bd26e9a0bd15f9aa1e7de5" }
# `Inflate::try_clone` and `Inflate::allocation_size`, which Flate checkpoints need.
zlib-rs = { git = "https://github.com/Vantrongs/zlib-rs", rev = "124359709a6ed94bda6fe1ff4d413e23bbae34e5" }
# `zune_jpeg::rows`, which grayscale JPEG rows need.
zune-jpeg = { git = "https://github.com/Vantrongs/zune-image", rev = "2e46fb05d943379251c8a0df554dbd82260ffbeb" }
# A tag's duplicate attributes found through a set keyed by the names' text, so
# that rich text with many attributes on one tag is parsed in linear time
# (servo/html5ever issue 796), and a `meta` Content-Type cut after `charset`
# read without a panic (servo/html5ever PR 764, released in 0.40.1).
html5ever = { git = "https://github.com/Vantrongs/html5ever", rev = "16c09dc3dab410bf600c2a721d8a5dfd500c9324" }
# Atoms longer than 7 bytes placed by a per-process random hash rather than in
# 4,096 lists by a fixed one, so that attribute names chosen to share a list do
# not make interning them quadratic; with upstream's fixes for an uninitialized
# buffer and a reference count overflow (servo/string-cache PRs 300, 301).
string_cache = { git = "https://github.com/Vantrongs/string-cache", rev = "fa62c6494ca80e41784fb79760ca2e8e0d079ab4" }
# `NumberToken`, which writes a copied number as its source writes it: an i32 or
# f32 cannot hold `4294967297`, `5.0` or `--5` as viewers read them.
pdf-writer = { git = "https://github.com/Vantrongs/pdf-writer", rev = "daf9012abec3d7284d756c48ae9d5e5e01cf18b6" }
